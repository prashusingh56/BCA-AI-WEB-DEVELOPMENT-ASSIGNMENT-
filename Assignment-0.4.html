<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Section</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7ff;
            color: #222;
        }

        .landing-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            background-color: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .content {
            flex: 1;
        }

        .content h1 {
            font-size: 42px;
            color: #263b80;
            margin-bottom: 20px;
        }

        .content p {
            font-size: 17px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background-color: #405de6;
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #263b80;
            transform: translateY(-3px);
        }

        .image-box {
            flex: 1;
            background: linear-gradient(135deg, #405de6, #8e44ad);
            color: white;
            min-height: 280px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .image-box h2 {
            font-size: 30px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 30px 20px;
            }

            .content h1 {
                font-size: 32px;
            }

            .image-box {
                width: 100%;
                min-height: 200px;
            }
        }
    </style>
</head>

<body>

    <section class="landing-section">
        <div class="container">

            <div class="content">
                <h1>Build Your Future With Us</h1>

                <p>
                    Welcome to our website! Discover new opportunities,
                    improve your skills, and take the next step toward
                    achieving your goals.
                </p>

                <a href="#learn" class="btn">Get Started</a>
            </div>

            <div class="image-box">
                <h2>Dream Big.<br>Start Today!</h2>
            </div>

        </div>
    </section>

</body>
</html>
