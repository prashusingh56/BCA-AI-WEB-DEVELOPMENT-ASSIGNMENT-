<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background: white;
            width: 420px;
            max-width: 100%;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .details p {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .details strong {
            color: #333;
        }

        .status {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 13px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        #subjects {
            color: #555;
        }
    </style>
</head>

<body>

    <div class="profile-card">
        <h1>Student Profile</h1>
        <p class="subtitle">Student Information Dashboard</p>

        <div class="details" id="profileDetails"></div>

        <button type="button" onclick="showSubjects()">
            Show Subjects
        </button>

        <p id="subjects"></p>
    </div>

    <script>
        // String data type
        let studentName = "Ratna Singh";
        let course = "BCA Artificial Intelligence";
        let college = "Invertis University";

        // Number data type
        let studentAge = 20;
        let semester = 3;
        let percentage = 83.83;

        // Boolean data type
        let isEnrolled = true;

        // Array data type
        let subjects = [
            "Java Programming",
            "Web Development",
            "Data Structures",
            "Database Management"
        ];

        // Object data type
        let student = {
            rollNumber: 101,
            city: "Bareilly",
            status: "Active"
        };

        // Display profile information
        document.getElementById("profileDetails").innerHTML = `
            <p><strong>Name:</strong> ${studentName}</p>
            <p><strong>Age:</strong> ${studentAge}</p>
            <p><strong>Course:</strong> ${course}</p>
            <p><strong>College:</strong> ${college}</p>
            <p><strong>Semester:</strong> ${semester}</p>
            <p><strong>Percentage:</strong> ${percentage}%</p>
            <p><strong>Roll Number:</strong> ${student.rollNumber}</p>
            <p><strong>City:</strong> ${student.city}</p>
            <p><strong>Enrollment:</strong> ${isEnrolled ? "Yes" : "No"}</p>
            <p><strong>Status:</strong>
                <span class="status">${student.status}</span>
            </p>
        `;

        // Display array values
        function showSubjects() {
            document.getElementById("subjects").innerHTML =
                "<br><strong>Subjects:</strong><br>" +
                subjects.join("<br>");
        }
    </script>

</body>
</html>
