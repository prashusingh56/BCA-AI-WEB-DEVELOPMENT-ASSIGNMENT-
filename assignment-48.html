<!DOCTYPE html>
<html>
<head>
    <title>Pricing Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        .pricing-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            width: 250px;
            border-radius: 10px;
            box-shadow: 0 4px 10px #ccc;
        }

        .card h2 {
            color: #007bff;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        @media (max-width: 600px) {
            .pricing-container {
                flex-direction: column;
                align-items: center;
            }

            .card {
                width: 85%;
            }
        }
    </style>
</head>

<body>

<h1>Our Pricing Plans</h1>

<div class="pricing-container">

    <div class="card">
        <h2>Basic</h2>
        <p class="price">₹499</p>
        <p>5 Projects</p>
        <p>Email Support</p>
        <p>Basic Features</p>
        <button>Choose Plan</button>
    </div>

    <div class="card">
        <h2>Standard</h2>
        <p class="price">₹999</p>
        <p>10 Projects</p>
        <p>Priority Support</p>
        <p>Extra Features</p>
        <button>Choose Plan</button>
    </div>

    <div class="card">
        <h2>Premium</h2>
        <p class="price">₹1499</p>
        <p>Unlimited Projects</p>
        <p>24/7 Support</p>
        <p>All Features</p>
        <button>Choose Plan</button>
    </div>

</div>

</body>
  </html>
