<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            text-align: center;
        }

        header {
            background: #222;
            color: white;
            padding: 30px;
        }

        .about, .projects, .contact {
            padding: 30px;
        }

        .project-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .project {
            background: white;
            padding: 20px;
            width: 220px;
            border-radius: 8px;
            box-shadow: 0 3px 8px #ccc;
        }

        footer {
            background: #222;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>My Portfolio</h1>
    <p>Hello! I am a Web Developer</p>
</header>

<section class="about">
    <h2>About Me</h2>
    <p>I am a student interested in web development
       and programming.</p>
</section>

<section class="projects">
    <h2>My Projects</h2>

    <div class="project-container">

        <div class="project">
            <h3>Project 1</h3>
            <p>Student Management System</p>
        </div>

        <div class="project">
            <h3>Project 2</h3>
            <p>Personal Website</p>
        </div>

        <div class="project">
            <h3>Project 3</h3>
            <p>Calculator Application</p>
        </div>

    </div>
</section>

<section class="contact">
    <h2>Contact Me</h2>
    <p>Email: myemail@gmail.com</p>
</section>

<footer>
    <p>© 2026 My Portfolio</p>
</footer>

</body>
</html>
