<!DOCTYPE html>
<html>
<head>
    <title>Testimonials</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 30px;
        }

        .container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .card {
            background: white;
            width: 250px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px #ccc;
        }

        .card img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }

        .card h3 {
            color: #007bff;
        }

        .stars {
            color: orange;
            font-size: 20px;
        }
    </style>
</head>

<body>

<h1>What Our Customers Say</h1>

<div class="container">

    <div class="card">
        <img src="https://i.pravatar.cc/100?img=1" alt="Customer">
        <h3>Rahul Sharma</h3>
        <p class="stars">★★★★★</p>
        <p>Excellent service and great experience.</p>
    </div>

    <div class="card">
        <img src="https://i.pravatar.cc/100?img=5" alt="Customer">
        <h3>Priya Verma</h3>
        <p class="stars">★★★★★</p>
        <p>Very helpful and professional team.</p>
    </div>

    <div class="card">
        <img src="https://i.pravatar.cc/100?img=9" alt="Customer">
        <h3>Aman Gupta</h3>
        <p class="stars">★★★★☆</p>
        <p>I am happy with the quality of work.</p>
    </div>

</div>

</body>
</html>
