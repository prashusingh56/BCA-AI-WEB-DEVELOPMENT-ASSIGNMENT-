<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Hover Effects</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 40px 15px;
        }

        h1 {
            color: #312e81;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.4s ease;
        }

        .btn1 {
            background: #4f46e5;
        }

        .btn1:hover {
            background: #312e81;
            transform: scale(1.1);
        }

        .btn2 {
            background: #16a34a;
        }

        .btn2:hover {
            background: #14532d;
            transform: translateY(-8px);
        }

        .btn3 {
            background: #ea580c;
        }

        .btn3:hover {
            background: #9a3412;
            letter-spacing: 2px;
        }

        .btn4 {
            background: #db2777;
        }

        .btn4:hover {
            background: #9d174d;
            box-shadow: 0 8px 20px rgba(219,39,119,0.4);
        }

        .btn5 {
            background: #0891b2;
        }

        .btn5:hover {
            transform: rotate(-3deg);
            background: #164e63;
        }

        button:focus-visible {
            outline: 3px solid black;
            outline-offset: 4px;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <h1>CSS Button Hover Effects</h1>

    <p>Move your mouse over the buttons to see the effects.</p>

    <div class="button-container">

        <button class="btn1">Scale Effect</button>

        <button class="btn2">Slide Effect</button>

        <button class="btn3">Text Effect</button>

        <button class="btn4">Shadow Effect</button>

        <button class="btn5">Rotate Effect</button>

    </div>

</body>
</html>
